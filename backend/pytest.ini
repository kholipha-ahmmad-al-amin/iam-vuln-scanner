[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
asyncio_mode = auto
addopts = -v --tb=short
markers =
    tier1: Tier 1 Core Feature Coverage tests
    tier2: Tier 2 Boundary and Corner Case tests
    tier3: Tier 3 Cross-Feature Combination tests
    tier4: Tier 4 Real-World Scenario tests
